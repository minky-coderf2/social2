<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문화 탐구 보드 — 2반</title>
<style>
:root {
  --bg: #ffffff;
  --bg2: #f7f7f5;
  --bg3: #f0efe9;
  --border: rgba(0,0,0,.10);
  --border2: rgba(0,0,0,.18);
  --text: #1a1a18;
  --text2: #5a5a56;
  --text3: #9a9a94;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-pill: 20px;
  --blue50:#E6F1FB; --blue200:#85B7EB; --blue400:#378ADD; --blue600:#185FA5; --blue800:#0C447C;
  --teal50:#E1F5EE; --teal200:#5DCAA5; --teal400:#1D9E75; --teal600:#0F6E56; --teal800:#085041;
  --purple50:#EEEDFE; --purple200:#AFA9EC; --purple400:#7F77DD; --purple600:#534AB7; --purple800:#3C3489;
  --coral50:#FAECE7; --coral200:#F0997B; --coral400:#D85A30; --coral600:#993C1D; --coral800:#712B13;
  --amber50:#FAEEDA; --amber200:#EF9F27; --amber400:#BA7517; --amber600:#854F0B; --amber800:#633806;
  --green50:#EAF3DE; --green400:#639922; --green600:#3B6D11; --green800:#27500A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: var(--bg2); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.6; }

/* 헤더 */
.site-header { background: var(--bg); border-bottom: 0.5px solid var(--border); padding: 0 1.5rem; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; }
.header-left { display: flex; align-items: center; gap: 10px; }
.site-title { font-size: 14px; font-weight: 500; color: var(--text); }
.cls-pill { padding: 3px 12px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 500; background: var(--blue50); color: var(--blue800); border: 0.5px solid var(--blue200); }
.tab-row { display: flex; }
.tab { padding: 0 18px; height: 52px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text3); border: none; background: none; border-bottom: 2px solid transparent; font-family: inherit; transition: color .15s, border-color .15s; }
.tab:hover { color: var(--text2); }
.tab.on { color: var(--blue400); border-bottom-color: var(--blue400); }

/* 레이아웃 */
.wrap { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

/* 타이머 */
.timer-strip { display: flex; align-items: center; gap: 12px; background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 1.25rem; }
.t-display { font-size: 20px; font-weight: 500; color: var(--text); min-width: 52px; font-variant-numeric: tabular-nums; }
.t-bar-bg { flex: 1; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
.t-bar { height: 100%; border-radius: 3px; background: var(--teal400); transition: width .5s linear, background .4s; }
.t-btn { padding: 6px 14px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--bg); font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; color: var(--text2); transition: background .15s; }
.t-btn:hover { background: var(--bg2); }

/* 섹션 레이블 */
.sec-label { font-size: 11px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--text3); margin-bottom: .5rem; }

/* 모둠 선택 */
.group-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 1.5rem; }
.g-btn { padding: 10px 6px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); background: var(--bg); font-size: 13px; font-weight: 500; cursor: pointer; text-align: center; font-family: inherit; color: var(--text2); transition: all .15s; }
.g-btn:hover { background: var(--bg2); border-color: var(--border2); }
.g-btn.g0 { border: 1.5px solid var(--blue400); background: var(--blue50); color: var(--blue800); }
.g-btn.g1 { border: 1.5px solid var(--teal400); background: var(--teal50); color: var(--teal800); }
.g-btn.g2 { border: 1.5px solid var(--purple400); background: var(--purple50); color: var(--purple800); }
.g-btn.g3 { border: 1.5px solid var(--coral400); background: var(--coral50); color: var(--coral800); }

/* 주제 선택 */
.theme-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 1.5rem; }
.th-btn { padding: 14px 10px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--bg); font-size: 13px; font-weight: 500; cursor: pointer; text-align: left; font-family: inherit; color: var(--text); transition: all .15s; }
.th-btn:hover { border-color: var(--border2); background: var(--bg2); }
.th-btn.on { border: 1.5px solid var(--blue400); background: var(--blue50); color: var(--blue800); }
.th-sub { font-size: 11px; color: var(--text3); margin-top: 3px; font-weight: 400; }
.th-btn.on .th-sub { color: var(--blue600); }

/* 입력 필드 */
.field { margin-bottom: 1rem; }
.field-label { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: .4rem; display: flex; align-items: center; gap: 6px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 500; }
.b-univ { background: var(--teal50); color: var(--teal800); }
.b-spec { background: var(--purple50); color: var(--purple800); }
.b-reason { background: var(--amber50); color: var(--amber800); }
input.ipt, textarea.ipt { width: 100%; padding: 8px 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--bg); font-family: inherit; font-size: 13px; color: var(--text); outline: none; transition: border-color .15s; }
input.ipt:focus, textarea.ipt:focus { border-color: var(--blue400); }
input.ipt::placeholder, textarea.ipt::placeholder { color: var(--text3); }
textarea.ipt { resize: none; line-height: 1.6; }
.c-row { display: flex; gap: 8px; margin-bottom: 6px; }
.c-name { width: 88px; flex-shrink: 0; }
.c-detail { flex: 1; }
.add-btn { padding: 6px 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border); background: transparent; font-size: 12px; cursor: pointer; color: var(--text3); font-family: inherit; transition: all .15s; }
.add-btn:hover { border-color: var(--blue400); color: var(--blue600); }

/* 공유 버튼 */
.divider { height: 0.5px; background: var(--border); margin: 1.25rem 0; }
.submit-btn { width: 100%; padding: 11px; border-radius: var(--radius-sm); border: 1.5px solid var(--blue400); background: var(--blue50); color: var(--blue800); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all .15s; }
.submit-btn:hover { background: var(--blue200); }
.notice { font-size: 12px; padding: 5px 0; display: none; }
.ok { color: var(--teal600); display: block; }
.err { color: var(--coral600); display: block; }

/* 보드 */
.board-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.board-count { font-size: 13px; color: var(--text2); }
.refresh-btn { padding: 6px 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--bg); font-size: 12px; cursor: pointer; color: var(--text2); font-family: inherit; }
.refresh-btn:hover { background: var(--bg2); }
.board-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin-bottom: 1.25rem; }
.b-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.b-card.empty { background: var(--bg2); display: flex; align-items: center; justify-content: center; min-height: 130px; }
.b-empty { text-align: center; color: var(--text3); font-size: 13px; line-height: 1.7; }
.b-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.b-gbadge { padding: 2px 10px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 500; }
.bg0 { background: var(--blue50); color: var(--blue800); }
.bg1 { background: var(--teal50); color: var(--teal800); }
.bg2 { background: var(--purple50); color: var(--purple800); }
.bg3 { background: var(--coral50); color: var(--coral800); }
.b-theme { font-size: 14px; font-weight: 500; color: var(--text); }
.b-sec { margin-bottom: 7px; }
.b-sec:last-child { margin-bottom: 0; }
.b-slabel { display: inline-block; padding: 2px 8px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 500; margin-bottom: 3px; }
.b-text { font-size: 12px; color: var(--text2); line-height: 1.6; }
.b-spec-row { display: flex; gap: 6px; font-size: 12px; color: var(--text2); margin-bottom: 2px; line-height: 1.5; }
.b-spec-country { font-weight: 500; color: var(--text); flex-shrink: 0; }

/* 토의 박스 */
.discuss { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; }
.discuss-q { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: .3rem; }
.discuss-hint { font-size: 12px; color: var(--text2); line-height: 1.7; }

@media (max-width: 560px) {
  .board-grid, .theme-grid { grid-template-columns: 1fr; }
  .group-row { grid-template-columns: repeat(2,1fr); }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-left">
    <span class="site-title">문화 탐구 보드</span>
    <span class="cls-pill">2반</span>
  </div>
  <div class="tab-row">
    <button class="tab on" onclick="showTab('write')">입력하기</button>
    <button class="tab" onclick="showTab('board')">모둠 보드</button>
  </div>
</header>

<div class="wrap">
  <div id="writePanel">

    <div class="timer-strip">
      <div class="t-display" id="tDisp">10:00</div>
      <div class="t-bar-bg"><div class="t-bar" id="tBar" style="width:100%;"></div></div>
      <button class="t-btn" id="tBtn" onclick="toggleTimer()">시작</button>
    </div>

    <div class="sec-label">우리 모둠</div>
    <div class="group-row" id="groupRow">
      <button class="g-btn" onclick="selGroup(0)">1모둠</button>
      <button class="g-btn" onclick="selGroup(1)">2모둠</button>
      <button class="g-btn" onclick="selGroup(2)">3모둠</button>
      <button class="g-btn" onclick="selGroup(3)">4모둠</button>
    </div>

    <div class="sec-label">탐구 주제</div>
    <div class="theme-grid" id="themeGrid">
      <button class="th-btn" onclick="selTheme(0)">인사 방식<div class="th-sub">악수·절·볼 맞대기 등</div></button>
      <button class="th-btn" onclick="selTheme(1)">식사 도구<div class="th-sub">젓가락·포크·맨손 등</div></button>
      <button class="th-btn" onclick="selTheme(2)">생일 기념<div class="th-sub">케이크·미역국·특별 음식</div></button>
      <button class="th-btn" onclick="selTheme(3)">학교 점심<div class="th-sub">급식·도시락·카페테리아</div></button>
      <button class="th-btn" onclick="selTheme(4)">새해 풍습<div class="th-sub">세배·불꽃놀이·전통 음식</div></button>
      <button class="th-btn" onclick="selTheme(5)">가족 호칭<div class="th-sub">언니·오빠·성씨 부르기</div></button>
    </div>

    <div class="field">
      <div class="field-label"><span class="badge b-spec">나라별 특수성</span> 나라마다 어떻게 다른가요? (모둠원별 1개국씩 조사할 것)</div>
      <div id="countryRows"></div>
      <button class="add-btn" onclick="addCountry()">+ 나라 추가</button>
    </div>

    <div class="field">
      <div class="field-label"><span class="badge b-univ">보편성</span> 모든 나라의 공통점을 한 문장으로</div>
      <textarea class="ipt" id="univInput" rows="2" placeholder="모든 나라의 공통점을 한 문장으로 써보세요."></textarea>
    </div>

    <div class="field">
      <div class="field-label"><span class="badge b-reason">차이의 이유</span> 왜 나라마다 다를까요?</div>
      <textarea class="ipt" id="reasonInput" rows="2" placeholder="환경, 역사, 가치관 중 골라서 이유를 설명해보세요."></textarea>
    </div>

    <div class="divider"></div>
    <div id="saveNotice" class="notice"></div>
    <button class="submit-btn" onclick="submitData()">모둠 보드에 공유하기</button>

  </div>

  <div id="boardPanel" style="display:none;">
    <div class="board-top">
      <div class="board-count" id="boardCount">공유된 모둠 결과</div>
      <button class="refresh-btn" onclick="loadBoard()">새로고침</button>
    </div>
    <div class="board-grid" id="boardGrid"></div>
    <div class="discuss">
      <div class="discuss-q">전체 토의 — 4모둠 결과를 비교해보세요</div>
      <div class="discuss-hint">주제가 달라도 "모든 나라에 공통점이 있고, 구체적 모습은 나라마다 다르다"는 패턴이 반복되나요?<br>이것이 바로 보편성과 특수성이 하나의 문화 안에 함께 존재한다는 의미예요.</div>
    </div>
  </div>
</div>

<script>
const CLS = '2';
const SK = 'cult_2_v2';
const THEMES = ['인사 방식','식사 도구','생일 기념','학교 점심','새해 풍습','가족 호칭'];
const GNAMES = ['1모둠','2모둠','3모둠','4모둠'];
const GCLS = ['g0','g1','g2','g3'];
const BGCLS = ['bg0','bg1','bg2','bg3'];


let curGroup = -1, curTheme = -1;
let countries = [{c:'',d:''},{c:'',d:''}];
let stored = {0:null,1:null,2:null,3:null};
let timerOn=false, timerSt=false, secsLeft=600, timerInt=null;

function showTab(t) {
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('on',(t==='write'&&i===0)||(t==='board'&&i===1)));
  document.getElementById('writePanel').style.display = t==='write' ? '' : 'none';
  document.getElementById('boardPanel').style.display = t==='board' ? '' : 'none';
  if(t==='board') loadBoard();
}

function selGroup(i) {
  curGroup = i;
  document.querySelectorAll('.g-btn').forEach((b,j)=>{
    b.className = 'g-btn' + (j===i ? ' '+GCLS[i] : '');
  });
  const s = stored[i];
  if(s) {
    curTheme = s.theme;
    countries = s.countries && s.countries.length ? s.countries : [{c:'',d:''},{c:'',d:''}];
    document.getElementById('univInput').value = s.univ||'';
    document.getElementById('reasonInput').value = s.reason||'';
    renderTheme(); renderCountries();
  }
}

function selTheme(i) {
  curTheme = i;
  document.querySelectorAll('.th-btn').forEach((b,j)=>b.classList.toggle('on',j===i));
}

function renderTheme() {
  document.querySelectorAll('.th-btn').forEach((b,j)=>b.classList.toggle('on',j===curTheme));
}

function renderCountries() {
  document.getElementById('countryRows').innerHTML = countries.map((ct,i)=>`
    <div class="c-row">
      <input class="ipt c-name" placeholder="나라" value="${ct.c}" oninput="countries[${i}].c=this.value">
      <input class="ipt c-detail" placeholder="이 나라만의 구체적인 모습" value="${ct.d}" oninput="countries[${i}].d=this.value">
    </div>`).join('');
}

function addCountry() {
  countries.push({c:'',d:''});
  renderCountries();
}

async function submitData() {
  if(curGroup<0){ showNotice('모둠을 먼저 선택해주세요.','err'); return; }
  if(curTheme<0){ showNotice('주제를 먼저 선택해주세요.','err'); return; }
  const data = {
    group: curGroup, theme: curTheme,
    countries: countries.filter(c=>c.c||c.d),
    univ: document.getElementById('univInput').value,
    reason: document.getElementById('reasonInput').value,
    ts: Date.now()
  };
  try {
    await window.storage.set(SK+'_g'+curGroup, JSON.stringify(data), true);
    stored[curGroup] = data;
    showNotice('공유됐어요!','ok');
    setTimeout(()=>{ document.getElementById('saveNotice').className='notice'; showTab('board'); }, 700);
  } catch(e) { showNotice('저장 중 오류가 발생했어요.','err'); }
}

function showNotice(msg, type) {
  const el = document.getElementById('saveNotice');
  el.textContent = msg; el.className = 'notice ' + type;
}

async function loadBoard() {
  for(let i=0;i<4;i++){
    try {
      const r = await window.storage.get(SK+'_g'+i, true);
      stored[i] = r&&r.value ? JSON.parse(r.value) : null;
    } catch(e){ stored[i]=null; }
  }
  renderBoard();
}

function renderBoard() {
  const filled = Object.values(stored).filter(Boolean).length;
  document.getElementById('boardCount').textContent = `공유된 모둠 결과 ${filled}/4`;
  document.getElementById('boardGrid').innerHTML = [0,1,2,3].map(i=>{
    const d = stored[i];
    if(!d) return `<div class="b-card empty">
      <div class="b-empty">${GNAMES[i]}<br>아직 공유 전이에요</div>
    </div>`;
    const specRows = (d.countries||[]).map(c=>`
      <div class="b-spec-row"><span class="b-spec-country">${c.c||'?'}</span><span>${c.d||''}</span></div>`).join('');
    return `<div class="b-card">
      <div class="b-head">
        <span class="b-gbadge ${BGCLS[i]}">${GNAMES[i]}</span>
        <span class="b-theme">${THEMES[d.theme]||''}</span>
      </div>
      ${d.univ?`<div class="b-sec"><span class="b-slabel b-univ">보편성</span><div class="b-text">${d.univ}</div></div>`:''}
      ${specRows?`<div class="b-sec"><span class="b-slabel b-spec">나라별 특수성</span><div>${specRows}</div></div>`:''}
      ${d.reason?`<div class="b-sec"><span class="b-slabel b-reason">차이의 이유</span><div class="b-text">${d.reason}</div></div>`:''}
    </div>`;
  }).join('');
}

function toggleTimer() {
  if(secsLeft<=0) return;
  if(timerOn){
    clearInterval(timerInt); timerOn=false;
    document.getElementById('tBtn').textContent = timerSt?'재개':'시작';
  } else {
    timerSt=true; timerOn=true;
    document.getElementById('tBtn').textContent = '일시정지';
    timerInt = setInterval(()=>{
      if(secsLeft<=0){
        clearInterval(timerInt); timerOn=false;
        document.getElementById('tBtn').textContent='종료';
        document.getElementById('tDisp').textContent='완료!';
        document.getElementById('tBar').style.background='#D85A30';
        return;
      }
      secsLeft--;
      const m=Math.floor(secsLeft/60), s=secsLeft%60;
      document.getElementById('tDisp').textContent=m+':'+s.toString().padStart(2,'0');
      document.getElementById('tBar').style.width=(secsLeft/600*100)+'%';
      document.getElementById('tBar').style.background=secsLeft<=120?'#BA7517':'#1D9E75';
    },1000);
  }
}

renderCountries();
</script>
</body>
</html>
